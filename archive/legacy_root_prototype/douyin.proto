syntax = "proto3";

// 抖音直播 WebSocket 推送帧
message PushFrame {
  uint64 seq_id     = 1;
  uint64 log_id     = 2;
  uint64 service    = 3;
  uint64 method     = 4;
  string payload_encoding = 6;
  string payload_type     = 7;
  bytes  payload          = 8;
}

// 推送内容（包含多条消息）
message Response {
  repeated Message messages    = 1;
  string           cursor      = 2;
  uint64           fetch_interval = 3;
  uint64           now         = 4;
  string           internal_ext = 5;
  uint32           fetch_type  = 6;
  uint64           log_id      = 8;
  uint64           need_ack    = 9;
  string           push_server = 10;
}

message Message {
  string method      = 1;
  bytes  payload     = 2;
  uint64 msg_id      = 3;
  uint32 msg_type    = 4;
  uint64 offset      = 5;
  bool   need_ack    = 6;
  uint64 msg_value   = 7;
}

// 弹幕/评论
message ChatMessage {
  Common common  = 1;
  User   user    = 2;
  string content = 3;
}

// 礼物
message GiftMessage {
  Common common     = 1;
  User   user       = 2;
  Gift   gift       = 3;
  uint64 gift_count = 5;
  uint64 combo      = 9;
}

// 点赞
message LikeMessage {
  Common common = 1;
  User   user   = 2;
  uint64 count  = 3;
  uint64 total  = 4;
}

// 进入直播间
message MemberMessage {
  Common common = 1;
  User   user   = 2;
}

message Common {
  string method   = 1;
  uint64 msg_id   = 2;
  uint64 room_id  = 3;
  int64  create_time = 4;
  uint32 monitor  = 5;
  string describe = 6;
  string fold_type = 7;
}

message User {
  uint64 id        = 1;
  uint64 short_id  = 2;
  string nick_name = 3;
  uint32 gender    = 4;
  string signature = 5;
  uint32 level     = 6;
}

message Gift {
  uint64 id   = 1;
  string name = 14;
}

.ai-canvas:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#edf3ff 1px,transparent 1px),linear-gradient(90deg,#edf3ff 1px,transparent 1px);background-size:28px 28px;opacity:.7}.ai-canvas:after{content:"";position:absolute;inset:-25% -30%;z-index:0;background:linear-gradient(110deg,transparent 18%,rgba(255,255,255,.34) 34%,rgba(53,212,255,.16) 48%,transparent 66%);transform:translateX(-48%) rotate(8deg);animation:canvasScan 8.5s cubic-bezier(.45,0,.2,1) infinite;pointer-events:none}.ai-canvas-lines{position:absolute;inset:0;width:100%;height:100%;z-index:1}.ai-canvas-lines path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:opacity .55s cubic-bezier(.22,.61,.36,1),filter .55s cubic-bezier(.22,.61,.36,1),stroke-width .45s ease,visibility 0s linear .55s}.ai-canvas-lines path.pipe{stroke:#7fb4ff;stroke-width:1.3;opacity:0;filter:blur(.2px);visibility:hidden}.ai-canvas-lines path.bus{stroke:#7fb4ff;stroke-width:1.3;opacity:0;filter:blur(.2px);visibility:hidden}.ai-canvas-lines path.energy{stroke:url(#aiLineGradient);stroke-width:2.45;stroke-dasharray:18 74;stroke-dashoffset:96;opacity:0;visibility:hidden;filter:drop-shadow(0 0 8px rgba(53,212,255,.9)) drop-shadow(0 0 18px rgba(91,97,255,.36));animation:electricFlow .72s linear infinite paused}.ai-canvas-lines path.energy-alt{stroke-width:1.45;stroke-dasharray:7 48;stroke-dashoffset:-48;filter:drop-shadow(0 0 6px rgba(255,255,255,.92)) drop-shadow(0 0 12px rgba(53,212,255,.76));animation:electricFlowAlt .96s linear infinite paused}.ai-canvas-lines path.visible{visibility:visible;transition-delay:0s}.ai-canvas-lines path.visible.pipe,.ai-canvas-lines path.visible.bus{opacity:.98;filter:blur(0);stroke-width:1.38}.ai-canvas-lines path.visible.energy{opacity:1;animation-play-state:running}.ai-canvas-lines path.visible.energy-alt{opacity:.95;animation-play-state:running}.ai-canvas-lines path.energy:nth-of-type(2n){animation-delay:.08s}.ai-canvas-lines path.energy:nth-of-type(3n){animation-delay:.18s}@keyframes electricFlow{0%{stroke-dashoffset:96;opacity:.18}10%{opacity:1}72%{opacity:1}100%{stroke-dashoffset:-96;opacity:.22}}@keyframes electricFlowAlt{0%{stroke-dashoffset:-48;opacity:.18}20%{opacity:.9}78%{opacity:.9}100%{stroke-dashoffset:64;opacity:.24}}@keyframes canvasScan{0%,18%{transform:translateX(-55%) rotate(8deg);opacity:0}30%{opacity:.95}68%{opacity:.8}100%{transform:translateX(55%) rotate(8deg);opacity:0}}
.ai-data-sparks{position:absolute;inset:0;z-index:2;pointer-events:none}.ai-data-sparks i{position:absolute;width:5px;height:5px;border-radius:50%;background:#35d4ff;box-shadow:0 0 0 4px rgba(53,212,255,.12),0 0 18px rgba(53,212,255,.55);opacity:.48;animation:sparkDrift 7.5s ease-in-out infinite}.ai-data-sparks i:nth-child(1){left:9%;top:20%;animation-delay:.1s}.ai-data-sparks i:nth-child(2){left:28%;top:74%;animation-delay:1.1s}.ai-data-sparks i:nth-child(3){left:47%;top:25%;animation-delay:2.2s}.ai-data-sparks i:nth-child(4){left:67%;top:70%;animation-delay:3.1s}.ai-data-sparks i:nth-child(5){left:86%;top:39%;animation-delay:4.2s}.ai-data-sparks i:nth-child(6){left:54%;top:55%;animation-delay:5.1s}@keyframes sparkDrift{0%,100%{transform:translate3d(0,0,0) scale(.7);opacity:.28}45%{transform:translate3d(18px,-14px,0) scale(1.15);opacity:.78}}
.ai-orbit-field{position:absolute;left:50%;top:58%;z-index:2;width:230px;height:152px;transform:translate(-50%,-50%);pointer-events:none;opacity:.95}.ai-orbit-field:before{content:"";position:absolute;left:50%;top:50%;width:86px;height:86px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.8) 0 22%,rgba(53,212,255,.18) 35%,transparent 68%);filter:blur(.2px);animation:corePulse 3.2s ease-in-out infinite}.ai-orbit-field i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(53,212,255,.26);box-shadow:0 0 42px rgba(53,212,255,.15) inset,0 0 24px rgba(53,212,255,.08);animation:orbitFloat 7.2s ease-in-out infinite}.ai-orbit-field i:nth-child(2){inset:18px 26px;border-color:rgba(91,97,255,.28);animation-delay:1.1s;animation-duration:8.6s}.ai-orbit-field i:nth-child(3){inset:35px 54px;border-color:rgba(255,255,255,.78);animation-delay:2.2s;animation-duration:6.9s}@keyframes orbitFloat{50%{transform:scale(1.08) rotate(4deg);opacity:.55}}@keyframes corePulse{50%{transform:translate(-50%,-50%) scale(1.16);opacity:.62}}
.ai-canvas-node{position:absolute;z-index:4;width:132px;min-height:58px;padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid #dce7fb;box-shadow:0 10px 24px rgba(43,59,88,.10);transform:translate3d(0,22px,0) scale(.965);opacity:0;filter:blur(6px);transition:opacity 1.45s cubic-bezier(.22,.61,.36,1),transform 1.45s cubic-bezier(.22,.61,.36,1),filter 1.45s cubic-bezier(.22,.61,.36,1),box-shadow .8s ease}.ai-canvas-node.visible{transform:translate3d(0,0,0) scale(1);opacity:1;filter:blur(0);box-shadow:0 15px 34px rgba(43,59,88,.14),0 0 0 1px rgba(53,212,255,.06)}.ai-canvas-node.visible:after{content:"";position:absolute;inset:-2px;border-radius:14px;border:1px solid rgba(53,212,255,.42);opacity:0;animation:nodeWake 2.6s ease-out infinite}.ai-canvas-node:before{content:"";position:absolute;left:10px;top:10px;width:8px;height:8px;border-radius:50%;background:#35d4ff;box-shadow:0 0 0 5px rgba(53,212,255,.12),0 0 16px rgba(53,212,255,.55)}.ai-canvas-node b{display:block;padding-left:16px;font-size:12px;color:#172033;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ai-canvas-node span{display:block;margin-top:5px;font-size:10px;color:#728096;line-height:1.45}.ai-canvas-node em{display:inline-flex;margin-top:6px;font-style:normal;font-size:10px;color:#5b61ff;background:#eef0ff;border-radius:999px;padding:2px 7px}@keyframes nodeWake{0%{opacity:.7;transform:scale(.98)}100%{opacity:0;transform:scale(1.12)}}
.ai-canvas-cursor{position:absolute;z-index:3;right:14px;bottom:12px;border:1px solid #dce7fb;background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(43,59,88,.10);border-radius:999px;padding:7px 11px;font-size:12px;color:#5a6880}.ai-canvas-cursor i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#35d4ff;margin-right:6px;box-shadow:0 0 0 4px rgba(53,212,255,.12);animation:pulseDot 1.4s ease-in-out infinite}.ai-pulse-line{display:flex;gap:8px;align-items:center;font-size:12px;color:#66758d}.ai-pulse-line i{width:7px;height:7px;border-radius:50%;background:#35d4ff;box-shadow:0 0 0 4px rgba(53,212,255,.14);animation:pulseDot 1.4s ease-in-out infinite}@keyframes pulseDot{50%{transform:scale(1.35);box-shadow:0 0 0 8px rgba(53,212,255,.04)}}
.ai-right.processing{gap:0}.ai-right.processing .ai-processing-stage{height:100%;flex:1 1 100%}.ai-processing-stage{flex:1 1 auto;min-height:0;background:#fff;border:1px solid #e5edf8;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 30px rgba(31,41,55,.04)}.ai-processing-head{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;border-bottom:1px solid #e8eef7;background:linear-gradient(180deg,#fff,#fbfdff)}.ai-processing-head b{display:block;font-size:16px;color:#101828}.ai-processing-head span{display:block;margin-top:4px;font-size:12px;color:#65758d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ai-processing-head em{font-style:normal;font-size:12px;color:#64748b;background:#f2f6ff;border:1px solid #e0e9ff;border-radius:999px;padding:6px 10px;white-space:nowrap}.ai-processing-meter{margin-left:auto;display:flex;align-items:center;gap:8px;color:#64748b;font-size:12px;font-variant-numeric:tabular-nums}.ai-processing-meter .ai-progress-track{width:150px;height:5px;background:#e8eef8;border-radius:999px;overflow:hidden}.ai-processing-meter span{margin-top:0;color:#64748b}.ai-canvas.big{flex:1 1 auto;height:auto;min-height:360px;margin:12px 14px;border-radius:18px;background:radial-gradient(circle at 50% 56%,rgba(255,255,255,.82),transparent 22%),linear-gradient(135deg,#f8fcff,#eef6ff 54%,#f9fbff)}.ai-canvas.big:after{display:none}.ai-canvas.big:before{background-image:linear-gradient(rgba(190,207,232,.46) 1px,transparent 1px),linear-gradient(90deg,rgba(190,207,232,.46) 1px,transparent 1px);background-size:30px 30px;opacity:.72}.ai-canvas.big .ai-canvas-lines{z-index:1}.ai-canvas.big .ai-canvas-node{z-index:3;width:144px;min-height:64px}.ai-merge-hub{position:absolute;left:50%;top:54%;z-index:4;width:154px;min-height:72px;transform:translate(-50%,-50%) scale(.985);opacity:0;filter:blur(3px);border-radius:14px;border:1px solid #c6ddfb;background:rgba(255,255,255,.92);box-shadow:0 14px 38px rgba(53,80,130,.12),0 0 0 5px rgba(240,247,255,.72);padding:12px;text-align:center;color:#1f2a44;transition:opacity .72s cubic-bezier(.22,.61,.36,1),transform .72s cubic-bezier(.22,.61,.36,1),filter .72s cubic-bezier(.22,.61,.36,1)}.ai-merge-hub.visible{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1)}.ai-merge-hub:before{content:"";position:absolute;inset:-8px;border-radius:18px;border:1px solid rgba(53,212,255,.28);animation:hubBreath 3.4s ease-in-out infinite}.ai-merge-hub strong{display:block;font-size:14px}.ai-merge-hub span{display:block;margin-top:4px;font-size:11px;color:#64748b}.ai-merge-hub em{display:inline-flex;margin-top:8px;max-width:100%;font-style:normal;font-size:10px;color:#2458d3;background:#eef4ff;border-radius:999px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ai-fusion-node{width:168px!important;border-color:#8bdfff!important;background:linear-gradient(180deg,#fff,#f7fcff)!important;box-shadow:0 18px 42px rgba(53,212,255,.18),0 0 0 2px rgba(53,212,255,.10)!important}.ai-fusion-node:before{background:#5b61ff!important}.ai-processing-bottom{flex:0 0 auto;border-top:1px solid #e8eef7;padding:10px 14px 12px;background:#fbfdff}.ai-processing-bottom .ai-pulse-line{margin-bottom:9px;color:#263247;font-weight:700}.ai-processing-bottom .ai-agent-steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.ai-processing-bottom .ai-agent-step{background:#fff;border:1px solid #e8eef7;border-radius:10px;padding:8px 10px;min-width:0}.ai-processing-bottom .ai-agent-step span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@keyframes hubBreath{50%{transform:scale(1.025);opacity:.66}}
.export-overlay{position:fixed;inset:0;background:rgba(21,23,25,.45);z-index:9999;display:flex;align-items:center;justify-content:center}
.export-card{background:#fff;border-radius:12px;padding:32px 44px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.18);min-width:320px}
.export-card .title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:16px}
.export-card .desc{font-size:13px;color:var(--sub);margin-bottom:20px}
.export-track{height:6px;background:#edf1f5;border-radius:3px;overflow:hidden}
.export-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));border-radius:3px;transition:width .3s ease;min-width:4%}
.export-pct{margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
<div v-if="exporting.active" class="export-overlay">
  <div class="export-card">
    <div class="title">{{exporting.title}}</div>
    <div class="desc">{{exporting.desc}}</div>
    <div class="export-track"><div class="export-fill" :style="{width:exporting.pct+'%'}"></div></div>
    <div class="export-pct">{{exporting.pct < 100 ? exporting.pct+'%' : '正在保存文件…'}}</div>
  </div>
</div>
<template v-if="tour.active&&curTourStep">
<div class="tour-overlay" @click="nextTour"></div>
<div class="tour-spotlight" :class="{center:!tour.rect}" :style="tour.rect?{top:tour.rect.top-8+'px',left:tour.rect.left-8+'px',width:tour.rect.width+16+'px',height:tour.rect.height+16+'px'}:{}"></div>
<div class="tour-tip" :style="{top:tour.tipY+'px',left:tour.tipX+'px'}" @click.stop>
  <div class="tour-step">步骤 {{tour.idx+1}} / {{tourSteps.length}}</div>
  <div class="tour-title">{{curTourStep.title}}</div>
  <div class="tour-desc">{{curTourStep.desc}}</div>
  <div class="tour-dots"><i v-for="(_,i) in tourSteps" :key="i" :class="{active:i===tour.idx}"></i></div>
  <div class="tour-actions"><button class="tour-skip" @click="endTour">跳过引导</button><button class="tour-next" @click="nextTour">{{tour.idx===tourSteps.length-1?'开始使用':'下一步 →'}}</button></div>
</div>
</template>
<div class="shell">
  <aside class="side">
    <div class="logo"><div class="logo-mark"><i></i></div><strong>直播复盘侠</strong><small>直播复盘助手</small></div>
    <nav class="menu">
      <div v-for="item in navs" :key="item.key" class="menu-item" :class="{active:view===item.key}" @click="view=item.key">
        <span class="menu-icon"><el-icon><component :is="item.icon"/></el-icon></span><span>{{item.label}}</span>
      </div>
    </nav>
    <div class="side-foot">
      <div class="disk-line"><span>磁盘空间</span><span>{{diag.disk_text}}</span></div>
      <div class="disk-track"><div class="disk-fill" :style="{width:diskPercent+'%'}"></div></div>
      <div class="foot-link" :class="{active:view==='settings'}" @click="view='settings'"><el-icon><Setting/></el-icon><span>系统设置</span></div>
      <div class="version">直播复盘侠 v1.0.0<br>本地数据 · 本地转写</div>
    </div>
  </aside>
  <main class="app">
    <header class="top">
      <div class="crumb">{{activeNav.label}}<span>{{activeNav.desc}}</span></div>
      <div class="top-right">
        <div class="top-status"><i class="pulse"></i><span>服务运行中</span></div>
        <div class="top-icon" title="刷新" @click="refreshAll"><el-icon><Refresh/></el-icon></div>
        <div class="top-icon" title="新手引导" @click="startTour"><el-icon><QuestionFilled/></el-icon></div>
      </div>
    </header>
    <section class="content">
      <template v-if="view==='dashboard'">
        <div class="compact-status"><div class="compact-item"><span>所有主播</span><strong>{{(rooms||[]).length}}</strong></div><div class="compact-item live"><span>直播中</span><strong>{{liveCount}}</strong></div><div class="compact-item record"><span>录制中</span><strong>{{recordCount}}</strong></div><span class="grow"></span><span class="quiet">同时监听上限 {{maxActiveRooms}} 个</span></div>
        <div class="page-tools">
          <el-input v-model="keyword" class="search" placeholder="输入主播名称" clearable><template #prefix><el-icon><Search/></el-icon></template></el-input>
          <el-button type="primary" style="margin-left:8px">查询</el-button>
          <span class="grow"></span><el-button @click="startAll"><el-icon><VideoPlay/></el-icon>&nbsp;全部开始</el-button><el-button @click="stopAll"><el-icon><VideoPause/></el-icon>&nbsp;全部停止</el-button><el-button type="primary" @click="view='add'"><el-icon><Plus/></el-icon>&nbsp;添加主播</el-button>
        </div>
        <div v-if="risk.active||cookieNotice" class="notice"><el-icon><WarningFilled/></el-icon><span>{{risk.active?(risk.reason||'风控冷却中，稍后自动恢复。'):cookieNotice}}</span><span class="grow"></span><el-button size="small" @click="remint">重新登录</el-button></div>
        <div class="industry">
          <div class="industry-head"><div class="industry-name">全部主播</div><span class="industry-meta">{{(filteredRooms||[]).length}} 位主播</span><div class="industry-actions"><el-button size="small" text @click="dlSummary"><el-icon><Download/></el-icon>&nbsp;导出汇总</el-button></div></div>
          <el-table :data="filteredRooms" empty-text="暂无主播，请先添加主播" style="width:100%">
            <el-table-column label="主播" min-width="220">
              <template #default="{row}"><div class="anchor"><img v-if="row.avatar_url" :src="row.avatar_url" class="avatar" @error="handleAvatarError(row)"><div v-else class="avatar-fallback"><el-icon v-if="refreshingAnchors.has(row.rid)"><Loading/></el-icon><span v-else>{{avatarFallbackText(row)}}</span></div><div class="anchor-info"><div class="anchor-name">{{row.anchor_name||'主播资料待补充'}}</div><div class="anchor-state" :class="{live:isLive(row)}">{{anchorStatus(row)}}</div></div></div></template>
            </el-table-column>
            <el-table-column label="是否自动录制" width="120" align="center"><template #default="{row}"><el-switch :model-value="row.active" @change="v=>toggleRoom(row.rid,v)"/></template></el-table-column>
            <el-table-column label="录制视频" width="110" align="center"><template #default="{row}"><el-switch :model-value="row.record_video" @change="v=>toggleVideo(row.rid,v)"/><div style="font-size:11px;color:#a0aaba;line-height:1.2">较占磁盘</div></template></el-table-column>
            <el-table-column label="录制状态" width="160" align="center"><template #default="{row}"><span class="record-state" :class="stateClass(row)"><i></i>{{phaseText(row.phase)}}<b v-if="row.recording_since" style="margin-left:6px;font-variant-numeric:tabular-nums;font-weight:600">{{fmtDur(row.recording_since)}}</b></span></template></el-table-column>
            <el-table-column label="操作" width="270" align="right"><template #default="{row}"><el-button size="small" text type="primary" @click="dlExcel(row.rid)">查看数据</el-button><el-button size="small" text :loading="refreshingAnchors.has(row.rid)" @click="refreshAnchor(row)">刷新资料</el-button><el-button size="small" text @click="row.active?stopRoom(row.rid):startRoom(row.rid)">{{row.active?'停止':'开始'}}</el-button><el-popconfirm title="确定移除该主播？" @confirm="delRoom(row.rid)"><template #reference><el-button size="small" text type="danger">删除</el-button></template></el-popconfirm></template></el-table-column>
          </el-table>
        </div>
      </template>

      <template v-else-if="view==='add'">
        <div class="add-page">
          <div class="panel"><div class="panel-title">添加主播</div>
            <el-form label-position="top"><el-form-item label="主播分享链接或直播号"><el-input v-model="addText" type="textarea" :rows="5" placeholder="直播间链接 / 直播号 / 主页链接 / 分享文案，均可"/></el-form-item></el-form>
            <el-button type="primary" :loading="resolving" @click="doResolve">解析主播</el-button>
            <el-button v-if="resolved&&(resolved.web_id||resolved.room_id)" :loading="adding" @click="doAdd">添加到主播列表</el-button>
            <div v-if="addErr" style="color:var(--red);margin-top:12px">{{addErr}}</div>
            <div v-if="resolved&&!(resolved.web_id||resolved.room_id)" style="color:#9b6b13;background:#fff8e8;border:1px solid #f4d897;border-radius:6px;padding:10px 13px;margin-top:12px;font-size:12px;line-height:1.8">这是主页链接，拿不到直播号。请在该主播<b>正在直播</b>时，改用「直播间链接」或「直播号」添加。</div>
            <div v-if="resolved" class="preview"><div class="anchor"><img v-if="resolved.avatar_url" :src="resolved.avatar_url" class="avatar" @error="handleAvatarError(resolved)"><div v-else class="avatar-fallback"><span>{{avatarFallbackText(resolved)}}</span></div><div class="anchor-info"><div class="anchor-name">{{resolved.anchor_name||'主播资料暂未取得'}}</div><div class="anchor-state" :class="{live:resolved.is_live===true}">{{resolved.is_live===true?'正在直播':resolved.is_live===false?'当前未开播':'直播状态待确认'}}</div></div></div><div class="preview-row"><label>直播号</label><span>{{resolved.web_id||resolved.room_id}}</span></div><div class="preview-row"><label>来源链接</label><span>{{resolved.source_url}}</span></div></div>
          </div>
          <div class="panel"><div class="panel-title">说明</div><div style="color:#7d899a;line-height:2">添加后在数据大盘开启自动录制。主播开播即自动录音、转文字，全部在本机完成。</div></div>
        </div>
      </template>

      <template v-else-if="view==='review'">
        <div class="ai-workspace">
          <div class="ai-left">
            <div class="panel ai-select-panel">
              <div class="panel-title">选择复盘对象 <span class="ai-side-summary">已选 {{selData.length}} 个 · 录制 {{selectedDurationText}}</span></div>
              <div class="ai-filterbar">
                <el-select v-model="aiDateFilter" placeholder="选择日期" clearable size="small">
                  <el-option v-for="d in aiDateOptions" :key="d" :label="d" :value="d"></el-option>
                </el-select>
                <el-select v-model="aiSessionFilter" placeholder="选择场次" clearable size="small">
                  <el-option v-for="s in aiSessionOptions" :key="s.value" :label="s.label" :value="s.value"></el-option>
                </el-select>
              </div>
              <div class="history-toolbar"><el-button type="primary" :loading="aiReporting" @click="aiReport"><el-icon><MagicStick/></el-icon>&nbsp;开始AI复盘</el-button><el-button @click="toggleAllHist">全选 / 取消</el-button><span class="grow"></span><el-button @click="dlSelected"><el-icon><Files/></el-icon>&nbsp;下载所选主播</el-button></div>
              <div class="ai-table-card">
                <el-table ref="ht" :data="filteredAiDataRooms" @selection-change="s=>{selData=s;refreshWordCloud()}" height="100%" style="width:100%">

      if(line.startsWith('# ')){close();html+='<h1>'+inlineMd(line.slice(2))+'</h1>';continue}
      if(line.startsWith('>')){close();html+='<blockquote>'+inlineMd(line.replace(/^>\s*/,''))+'</blockquote>';continue}
      if(/^[-*]\s+/.test(line)){closeTable();if(!inList){html+='<ul>';inList=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}
      if(/^\d+[.、]\s*/.test(line)){close();const m=line.match(/^(\d+)[.、]\s*(.*)$/);html+='<div class="md-step-card"><b>'+(m?m[1]:'')+'</b><span>'+inlineMd(m?m[2]:line)+'</span></div>';continue}
      if(/^(数据说明|结论|建议|关键判断)[:：]/.test(line)){close();html+='<p class="md-callout">'+inlineMd(line)+'</p>';continue}
      close();html+='<p>'+inlineMd(line)+'</p>';
    }
    close();return html;
  }
  function mdToPlain(md){

      .replace(/^>\s?/gm,'')
      .replace(/^\s*[-*]\s+/gm,'')
      .replace(/\*\*(.*?)\*\*/g,'$1')
      .replace(/\[(.*?)\]\((.*?)\)/g,'$1')
      .replace(/\s+/g,' ')
      .trim();
  }

      const ch=full[i]||'';
      const step=/[，。；！？、,.!?]/.test(ch)?1:2;
      aiBrief.value=full.slice(0,Math.min(full.length,i+step));
      i+=step;
      const last=full[Math.max(0,i-1)]||'';
      const delay=/[。！？.!?]/.test(last)?130:/[，；、,;]/.test(last)?70:28;
      aiBriefTimer=setTimeout(tick,delay);
    };
    aiBriefTimer=setTimeout(tick,420);
  }

  async function askAi(preset){
    const ids=selectedIds();const q=String(preset||aiQuestion.value||'').trim();
    if(!ids.length)return ElMessage.warning('请先勾选要追问的主播');
    if(!q)return;
    const key=aiChatKey.value;
    if(key!==aiChatContextKey.value||aiMessages.value!==aiChatStore[key])activateAiChatContext();
    const contextMessages=aiChatStore[key]||aiMessages.value;
    const payloadMessages=contextMessages.filter(m=>!m.thinking).map(m=>({role:m.role,content:m.content}));
    payloadMessages.push({role:'user',content:q});
    const scrollChat=()=>nextTick(()=>{if(aiChatEl.value)aiChatEl.value.scrollTop=aiChatEl.value.scrollHeight});
    aiQuestion.value='';
    contextMessages.push({role:'user',content:q});
    const thinking={role:'assistant',content:'',status:'正在读取直播证据',thinking:true,streaming:true,steps:[]};
    contextMessages.push(thinking);
    aiMessages.value=contextMessages;
    aiAsking.value=true;
    scrollChat();
    const markLastStepDone=()=>{const last=thinking.steps?.[thinking.steps.length-1];if(last)last.done=true};
    const appendStage=(text)=>{
      const clean=String(text||'').trim();if(!clean)return;
      markLastStepDone();
      thinking.status=clean;
      thinking.steps.push({text:clean,done:false});
      scrollChat();
    };
    const appendAnswer=(text)=>{
      if(!text)return;
      markLastStepDone();
      thinking.thinking=false;
      thinking.streaming=true;
      thinking.content=(thinking.content||'')+String(text);
      scrollChat();
    };
    try{
      pushAiEvent({type:'chat',message:'正在基于当前主播证据回答追问'});
      const resp=await fetch('/api/ai/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rids:ids,messages:payloadMessages})});
      if(!resp.ok)throw new Error((await resp.text())||'追问失败');
      if(!resp.body)throw new Error('当前浏览器不支持流式读取');
      const reader=resp.body.getReader();const decoder=new TextDecoder('utf-8');let buf='';
      while(true){
        const {value,done}=await reader.read();
        if(done)break;
        buf+=decoder.decode(value,{stream:true});
        const parts=buf.split('\n\n');buf=parts.pop()||'';
        for(const part of parts){
          const line=part.split('\n').find(x=>x.startsWith('data:'));
          if(!line)continue;
          let ev=null;try{ev=JSON.parse(line.slice(5).trim())}catch(_e){continue}
          if(ev.type==='stage')appendStage(ev.message);
          else if(ev.type==='delta')appendAnswer(ev.content||'');
          else if(ev.type==='error')throw new Error(ev.message||'追问失败');
          else if(ev.type==='done'){markLastStepDone();thinking.status=ev.message||'回答完成'}
        }
      }
      if(!thinking.content){thinking.thinking=false;thinking.streaming=false;thinking.content='这次没有拿到有效回答，请换一个更具体的问题再试。'}
      thinking.streaming=false;thinking.thinking=false;markLastStepDone();scrollChat();
    }catch(e){const idx=contextMessages.indexOf(thinking);const msg={role:'assistant',content:'追问失败：'+(e.message||e)};if(idx>=0)contextMessages.splice(idx,1,msg);else contextMessages.push(msg);if(aiChatContextKey.value===key)aiMessages.value=contextMessages}
    finally{aiAsking.value=false}
  }

      if(!resp.ok){const e=await resp.text();throw new Error(e||'PDF 导出失败')}
      const blob=await resp.blob();
      exporting.pct=96;exporting.desc='PDF 已生成，正在唤起下载…';
      const objectUrl=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=objectUrl;
      a.download=aiPdfFile.value||'AI复盘报告.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(objectUrl),1500);
      exporting.pct=100;
      ElMessage.success('PDF 已开始下载');
    }catch(e){
      ElMessage.error('PDF 导出失败：'+(e.message||e));
    }finally{
      if(pdfDownloadTimer){clearInterval(pdfDownloadTimer);pdfDownloadTimer=null}
      pdfDownloading.value=false;
      setTimeout(()=>{exporting.active=false},650);
    }
  }

app.config.errorHandler=(err,_vm,info)=>{
  console.error('[VUE]',info,err);
  let dump='';
  try{
    if(window.__compiledCode){
      const cl=window.__compiledCode.split('\n');
      dump+='\n\n=== OUTER BODY ('+cl.length+' lines) — error at L245:52 ===\n';
      for(let i=241;i<=248&&i<cl.length;i++) dump+='L'+(i+1)+': '+cl[i].slice(0,500)+'\n';

      dump+='\n[__compiledCode not captured — proxy may not have fired]\n';

    const src=(window.__liveApp&&window.__liveApp._component&&window.__liveApp._component.render)?window.__liveApp._component.render.toString():'';
    if(src){
      const lines=src.split('\n');
      dump+='\n=== RENDER fn ('+lines.length+' lines) — first 6 lines ===\n';
      lines.slice(0,6).forEach((l,i)=>dump+='R'+(i+1)+': '+l.slice(0,300)+'\n');
      dump+='\n--- R60-R80 ---\n';
      lines.slice(59,80).forEach((l,i)=>dump+='R'+(i+60)+': '+l.slice(0,300)+'\n');
      dump+='\n--- R115-R135 ---\n';
      lines.slice(114,135).forEach((l,i)=>dump+='R'+(i+115)+': '+l.slice(0,300)+'\n');
    }
  }catch(de){dump+='\n[diag error] '+de}
  const pre=document.createElement('pre');
  pre.textContent=info+'\n\n'+err.stack+dump;
  pre.style.cssText='position:fixed;inset:0;padding:16px;background:#fff;color:#c00;font-size:10px;overflow:auto;z-index:9999;white-space:pre-wrap;word-break:break-all';
  document.body.appendChild(pre);
};

.setting-group{background:#fff;border-radius:6px;margin-bottom:10px;padding:0 20px}.setting-head{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;font-size:15px;color:var(--ink);font-weight:900}.setting-row{min-height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center}.setting-row:last-child{border-bottom:0}.setting-name{font-weight:700}.setting-desc{font-size:12px;color:#9aa5b4;margin-top:2px}.setting-value{margin-left:auto;display:flex;align-items:center;gap:8px;color:#687588}.health-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.health-dot.bad{background:var(--red)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:6px;padding:22px 16px;margin-bottom:10px}.step{position:relative;text-align:center;color:#738095}.step:not(:last-child):after{content:"";position:absolute;height:1px;background:#dfe6ef;top:16px;left:62%;right:-38%}.step-num{width:32px;height:32px;border-radius:50%;margin:0 auto 8px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:900}.step-title{font-weight:700;color:var(--text);font-size:13px}.step-desc{font-size:11px;margin-top:3px}
.perf-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}.perf-filters{background:#fff;border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:220px 140px 140px 160px 160px auto;gap:10px;align-items:center}.perf-score{font-size:22px;font-weight:900;color:var(--primary);font-variant-numeric:tabular-nums}.perf-score.pending{font-size:13px;color:#8a96a8;line-height:1.2}.rating-tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:#eef0ff;color:var(--primary);font-weight:800;font-size:12px}.rating-tag.good{background:#ebfff4;color:#14a45a}.rating-tag.warn{background:#fff8e8;color:#b7791f}.rating-tag.bad{background:#fff0f0;color:#d94343}.rating-tag.gray{background:#eef2f7;color:#718096}.perf-summary-cell{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55;color:#41516a}.perf-detail{display:grid;grid-template-columns:330px minmax(0,1fr);gap:10px}.perf-hero{background:#fff;border-radius:6px;padding:18px}.perf-hero-main{display:flex;gap:12px;align-items:center;margin-bottom:16px}.perf-hero-title{font-size:16px;font-weight:900;color:var(--ink)}.perf-big-score{font-size:48px;line-height:1;font-weight:900;color:var(--primary);margin:8px 0}.perf-meta{font-size:12px;color:#718096;line-height:1.9}.perf-ai-rule{margin-top:12px;padding:10px 12px;border-radius:6px;background:#f7fbff;color:#57708f;font-size:12px;line-height:1.7}.dim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:10px}.dim-card{background:#fff;border-radius:6px;padding:14px;border-top:3px solid var(--cyan)}.dim-name{font-weight:900;color:var(--ink)}.dim-score{font-size:24px;font-weight:900;color:var(--primary);margin:6px 0}.dim-text{font-size:12px;color:#6b778a;line-height:1.65}.perf-section{background:#fff;border-radius:6px;padding:16px;margin-bottom:10px}.perf-section-title{font-weight:900;color:var(--ink);font-size:15px;margin-bottom:12px;display:flex;align-items:center}.perf-section-title:before{content:"";width:4px;height:16px;background:var(--cyan);border-radius:2px;margin-right:9px}.evidence-list{display:grid;gap:8px}.evidence-item{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fbfdff;font-size:12px;line-height:1.7}.evidence-head{display:flex;gap:8px;align-items:center;color:#718096;margin-bottom:4px}.risk-high{color:#d94343;font-weight:800}.question-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.small-list{display:flex;flex-wrap:wrap;gap:8px}.small-pill{background:#f5f7ff;border-radius:999px;padding:5px 9px;font-size:12px;color:#5261d8}.perf-empty{height:220px;display:flex;align-items:center;justify-content:center;color:#9aa5b4}.perf-back{margin-bottom:10px}
.faq{background:#fff;border-radius:6px;padding:4px 20px}.faq .el-collapse{border:0}.faq .el-collapse-item__header{font-weight:700;color:var(--text);border-bottom-color:var(--line)}.faq .el-collapse-item__wrap{border-bottom-color:var(--line)}.faq .el-collapse-item__content{color:#748195;line-height:1.9}
@media(max-width:900px){.side{width:126px;flex-basis:126px}.add-page{grid-template-columns:1fr}.mini-stat{min-width:110px}.content{padding:7px}}
.tour-overlay{position:fixed;inset:0;z-index:10000;pointer-events:auto}
.tour-spotlight{position:fixed;z-index:10001;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.55);transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none}
.tour-spotlight.center{width:0;height:0;top:50%;left:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
.tour-tip{position:fixed;z-index:10002;background:#fff;border-radius:14px;padding:28px 28px 22px;width:360px;box-shadow:0 12px 40px rgba(0,0,0,.22);animation:tourIn .3s ease}
@keyframes tourIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.tour-tip .tour-step{font-size:11px;color:var(--primary);font-weight:700;margin-bottom:6px;letter-spacing:.5px}
.tour-tip .tour-title{font-size:17px;font-weight:900;color:var(--ink);margin-bottom:8px}
.tour-tip .tour-desc{font-size:13px;color:var(--sub);line-height:1.7;margin-bottom:20px}
.tour-tip .tour-actions{display:flex;align-items:center;justify-content:space-between}
.tour-tip .tour-skip{border:0;background:none;color:#a0abba;font-size:13px;cursor:pointer;padding:0}
.tour-tip .tour-skip:hover{color:var(--sub)}
.tour-tip .tour-next{height:36px;padding:0 22px;border:0;border-radius:8px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.tour-tip .tour-next:hover{filter:brightness(1.12)}
.tour-dots{display:flex;gap:5px;justify-content:center;margin-bottom:18px}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:#dce2ea;transition:.2s}
.tour-dots i.active{width:18px;background:var(--primary)}
.export-overlay{position:fixed;inset:0;background:rgba(21,23,25,.45);z-index:9999;display:flex;align-items:center;justify-content:center}
.export-card{background:#fff;border-radius:12px;padding:32px 44px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.18);min-width:320px}
.export-card .title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:16px}
.export-card .desc{font-size:13px;color:var(--sub);margin-bottom:20px}
.export-track{height:6px;background:#edf1f5;border-radius:3px;overflow:hidden}
.export-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--cyan));border-radius:3px;transition:width .3s ease;min-width:4%}
.export-pct{margin-top:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
<div v-if="exporting.active" class="export-overlay">
  <div class="export-card">
    <div class="title">{{exporting.title}}</div>
    <div class="desc">{{exporting.desc}}</div>
    <div class="export-track"><div class="export-fill" :style="{width:exporting.pct+'%'}"></div></div>
    <div class="export-pct">{{exporting.pct < 100 ? exporting.pct+'%' : '正在保存文件…'}}</div>
  </div>
</div>
<template v-if="tour.active&&curTourStep">
<div class="tour-overlay" @click="nextTour"></div>
<div class="tour-spotlight" :class="{center:!tour.rect}" :style="tour.rect?{top:tour.rect.top-8+'px',left:tour.rect.left-8+'px',width:tour.rect.width+16+'px',height:tour.rect.height+16+'px'}:{}"></div>
<div class="tour-tip" :style="{top:tour.tipY+'px',left:tour.tipX+'px'}" @click.stop>
  <div class="tour-step">步骤 {{tour.idx+1}} / {{tourSteps.length}}</div>
  <div class="tour-title">{{curTourStep.title}}</div>
  <div class="tour-desc">{{curTourStep.desc}}</div>
  <div class="tour-dots"><i v-for="(_,i) in tourSteps" :key="i" :class="{active:i===tour.idx}"></i></div>
  <div class="tour-actions"><button class="tour-skip" @click="endTour">跳过引导</button><button class="tour-next" @click="nextTour">{{tour.idx===tourSteps.length-1?'开始使用':'下一步 →'}}</button></div>
</div>
</template>
<div class="shell">
  <aside class="side">
    <div class="logo"><div class="logo-mark"><i></i></div><strong>直播复盘侠</strong><small>直播复盘助手</small></div>
    <nav class="menu">
      <div v-for="item in navs" :key="item.key" class="menu-item" :class="{active:view===item.key}" @click="view=item.key">
        <span class="menu-icon"><el-icon><component :is="item.icon"/></el-icon></span><span>{{item.label}}</span>
      </div>
    </nav>
    <div class="side-foot">
      <div class="disk-line"><span>磁盘空间</span><span>{{diag.disk_text}}</span></div>
      <div class="disk-track"><div class="disk-fill" :style="{width:diskPercent+'%'}"></div></div>
      <div class="foot-link" :class="{active:view==='settings'}" @click="view='settings'"><el-icon><Setting/></el-icon><span>系统设置</span></div>
      <div class="version">直播复盘侠 v1.0.0<br>本地数据 · 本地转写</div>
    </div>
  </aside>
  <main class="app">
    <header class="top">
      <div class="crumb">{{activeNav.label}}<span>{{activeNav.desc}}</span></div>
      <div class="top-right">
        <div class="top-status"><i class="pulse"></i><span>服务运行中</span></div>
        <div class="top-icon" title="刷新" @click="refreshAll"><el-icon><Refresh/></el-icon></div>
        <div class="top-icon" title="新手引导" @click="startTour"><el-icon><QuestionFilled/></el-icon></div>
      </div>
    </header>
    <section class="content">
      <template v-if="view==='dashboard'">
        <div class="compact-status"><div class="compact-item"><span>所有主播</span><strong>{{(rooms||[]).length}}</strong></div><div class="compact-item live"><span>直播中</span><strong>{{liveCount}}</strong></div><div class="compact-item record"><span>录制中</span><strong>{{recordCount}}</strong></div><span class="grow"></span><span class="quiet">同时监听上限 {{maxActiveRooms}} 个</span></div>
        <div class="page-tools">
          <el-input v-model="keyword" class="search" placeholder="输入主播名称" clearable><template #prefix><el-icon><Search/></el-icon></template></el-input>
          <el-button type="primary" style="margin-left:8px">查询</el-button>
          <span class="grow"></span><el-button @click="startAll"><el-icon><VideoPlay/></el-icon>&nbsp;全部开始</el-button><el-button @click="stopAll"><el-icon><VideoPause/></el-icon>&nbsp;全部停止</el-button><el-button type="primary" @click="view='add'"><el-icon><Plus/></el-icon>&nbsp;添加主播</el-button>
        </div>
        <div v-if="risk.active||cookieNotice" class="notice"><el-icon><WarningFilled/></el-icon><span>{{risk.active?(risk.reason||'风控冷却中，稍后自动恢复。'):cookieNotice}}</span><span class="grow"></span><el-button size="small" @click="remint">重新登录</el-button></div>
        <div class="industry">
          <div class="industry-head"><div class="industry-name">全部主播</div><span class="industry-meta">{{(filteredRooms||[]).length}} 位主播</span><div class="industry-actions"><el-button size="small" text @click="dlSummary"><el-icon><Download/></el-icon>&nbsp;导出汇总</el-button></div></div>
          <el-table :data="filteredRooms" empty-text="暂无主播，请先添加主播" style="width:100%">
            <el-table-column label="主播" min-width="220">
              <template #default="{row}"><div class="anchor"><img v-if="row.avatar_url" :src="row.avatar_url" class="avatar" @error="row.avatar_url=''"><div v-else class="avatar-fallback"><el-icon><UserFilled/></el-icon></div><div class="anchor-info"><div class="anchor-name">{{row.anchor_name||'主播资料待补充'}}</div><div class="anchor-state" :class="{live:isLive(row)}">{{anchorStatus(row)}} · {{row.rid}}</div></div></div></template>
            </el-table-column>
            <el-table-column label="是否自动录制" width="120" align="center"><template #default="{row}"><el-switch :model-value="row.active" @change="v=>toggleRoom(row.rid,v)"/></template></el-table-column>
            <el-table-column label="录制视频" width="110" align="center"><template #default="{row}"><el-switch :model-value="row.record_video" @change="v=>toggleVideo(row.rid,v)"/><div style="font-size:11px;color:#a0aaba;line-height:1.2">较占磁盘</div></template></el-table-column>
            <el-table-column label="录制状态" width="160" align="center"><template #default="{row}"><span class="record-state" :class="stateClass(row)"><i></i>{{phaseText(row.phase)}}<b v-if="row.recording_since" style="margin-left:6px;font-variant-numeric:tabular-nums;font-weight:600">{{fmtDur(row.recording_since)}}</b></span></template></el-table-column>
            <el-table-column label="操作" width="270" align="right"><template #default="{row}"><el-button size="small" text type="primary" @click="dlExcel(row.rid)">查看数据</el-button><el-button size="small" text :loading="refreshingAnchors.has(row.rid)" @click="refreshAnchor(row)">刷新资料</el-button><el-button size="small" text @click="row.active?stopRoom(row.rid):startRoom(row.rid)">{{row.active?'停止':'开始'}}</el-button><el-popconfirm title="确定移除该主播？" @confirm="delRoom(row.rid)"><template #reference><el-button size="small" text type="danger">删除</el-button></template></el-popconfirm></template></el-table-column>
          </el-table>
        </div>
      </template>

      <template v-else-if="view==='add'">
        <div class="add-page">
          <div class="panel"><div class="panel-title">添加主播</div>
            <el-form label-position="top"><el-form-item label="主播分享链接或直播号"><el-input v-model="addText" type="textarea" :rows="5" placeholder="直播间链接 / 直播号 / 主页链接 / 分享文案，均可"/></el-form-item></el-form>
            <el-button type="primary" :loading="resolving" @click="doResolve">解析主播</el-button>
            <el-button v-if="resolved&&(resolved.web_id||resolved.room_id)" :loading="adding" @click="doAdd">添加到主播列表</el-button>
            <div v-if="addErr" style="color:var(--red);margin-top:12px">{{addErr}}</div>
            <div v-if="resolved&&!(resolved.web_id||resolved.room_id)" style="color:#9b6b13;background:#fff8e8;border:1px solid #f4d897;border-radius:6px;padding:10px 13px;margin-top:12px;font-size:12px;line-height:1.8">这是主页链接，拿不到直播号。请在该主播<b>正在直播</b>时，改用「直播间链接」或「直播号」添加。</div>
            <div v-if="resolved" class="preview"><div class="anchor"><img v-if="resolved.avatar_url" :src="resolved.avatar_url" class="avatar" @error="resolved.avatar_url=''"><div v-else class="avatar-fallback"><el-icon><UserFilled/></el-icon></div><div class="anchor-info"><div class="anchor-name">{{resolved.anchor_name||'主播资料暂未取得'}}</div><div class="anchor-state" :class="{live:resolved.is_live===true}">{{resolved.is_live===true?'正在直播':resolved.is_live===false?'当前未开播':'直播状态待确认'}}</div></div></div><div class="preview-row"><label>直播号</label><span>{{resolved.web_id||resolved.room_id}}</span></div><div class="preview-row"><label>来源链接</label><span>{{resolved.source_url}}</span></div></div>
          </div>
          <div class="panel"><div class="panel-title">说明</div><div style="color:#7d899a;line-height:2">添加后在数据大盘开启自动录制。主播开播即自动录音、转文字，全部在本机完成。</div></div>
        </div>
      </template>

      <template v-else-if="view==='review'">
        <div class="ai-workspace">
          <div class="ai-left">
            <div class="panel ai-select-panel">
              <div class="panel-title">选择复盘对象 <span class="ai-side-summary">已选 {{selData.length}} 个 · 话术 {{selectedTotals.transcripts}} · 弹幕 {{selectedTotals.events}} · 录音 {{selectedTotals.audio}}</span></div>
              <div class="history-toolbar"><el-button type="primary" :loading="aiReporting" @click="aiReport"><el-icon><MagicStick/></el-icon>&nbsp;开始AI复盘</el-button><el-button @click="toggleAllHist">全选 / 取消</el-button><span class="grow"></span><el-button @click="dlSelected"><el-icon><Files/></el-icon>&nbsp;下载所选主播</el-button></div>
              <div class="ai-table-card">
                <el-table ref="ht" :data="dataRooms" @selection-change="s=>{selData=s;refreshWordCloud()}" height="100%" style="width:100%">
                  <el-table-column type="selection" width="46"></el-table-column>
                  <el-table-column label="主播" min-width="180"><template #default="{row}">{{row.nickname||row.rid}}<div class="anchor-state">{{row.rid}}</div></template></el-table-column>
                  <el-table-column label="话术" prop="transcripts" width="92" align="center"></el-table-column>
                  <el-table-column label="弹幕" prop="events" width="92" align="center"></el-table-column>
                  <el-table-column label="录音" prop="audio_files" width="82" align="center"></el-table-column>
                  <el-table-column label="操作" width="150" align="right"><template #default="{row}"><el-button text type="primary" @click="dlExcel(row.rid)">导出</el-button><el-popconfirm title="确定彻底清除该主播数据？" @confirm="clearData(row.rid)"><template #reference><el-button text type="danger">清除</el-button></template></el-popconfirm></template></el-table-column>
                </el-table>
              </div>
            </div>
            <div class="word-cloud">
              <div class="panel-title" style="margin-bottom:6px">高频词排行 <span class="grow"></span><el-button text type="primary" @click="refreshWordCloud">刷新</el-button></div>
              <div class="word-cloud-body">
                <div v-for="w in aiWords.slice(0,12)" :key="w.word" class="freq-row"><span class="freq-word">{{w.word}}</span><span class="freq-track"><i class="freq-fill" :style="{width:freqWidth(w)}"></i></span><span class="freq-count">{{w.count}}</span></div>
                <span v-if="!aiWords.length" class="quiet">选择主播后自动生成高频词。</span>
              </div>
            </div>
          </div>
          <div class="ai-right">
            <div class="ai-agent">
              <div class="ai-agent-head"><div class="ai-agent-title">AI事件流</div><div class="ai-agent-sub">{{aiReporting?'正在处理':'等待任务'}}</div><div class="ai-progress"><div class="ai-progress-track"><div class="ai-progress-fill" :style="{width:aiProgress+'%'}"></div></div><span>{{aiProgress}}%</span></div></div>
              <div class="ai-events" ref="aiEventsEl">
                <div v-for="(ev,i) in aiEvents" :key="i" class="ai-event" :class="{warn:ev.type==='warning',error:ev.type==='error'}"><i class="ai-event-dot"></i><div><div>{{ev.message}}</div><span class="ai-event-time">{{ev.time}}</span></div></div>
                <div v-if="aiReporting" class="ai-event"><i class="ai-event-dot"></i><div><div class="ai-thinking"><span>AI 正在思考和整理证据</span><i></i><i></i><i></i></div><span class="ai-event-time">working</span></div></div>
                <div v-if="!aiEvents.length" class="ai-event"><i class="ai-event-dot"></i><div><div>选择主播后点击开始，AI会实时汇报处理进度。</div><span class="ai-event-time">ready</span></div></div>
              </div>
            </div>
            <div class="ai-report">
              <div class="ai-report-head"><span>复盘简报</span><span class="grow"></span><div class="ai-report-actions"><el-button v-if="aiReportFile" text type="primary" @click="downloadAiReport">下载完整报告</el-button><el-button v-if="aiReportDir" text type="primary" @click="openAiReportDir">打开目录</el-button></div></div>
              <div v-if="aiBrief || aiPreview" class="ai-report-html" v-html="aiBriefHtml"></div>
              <div v-else-if="aiReporting" class="ai-report-busy"><div class="ai-thinking"><i></i><i></i><i></i></div><strong>AI 正在生成复盘报告</strong><span>事件流会持续显示当前步骤，报告完成后自动呈现在这里。</span></div>
              <div v-else class="ai-empty"><el-icon><MagicStick/></el-icon><strong>等待生成简报</strong><span>完整报告生成后可下载或打开目录查看。</span></div>
            </div>
            <div class="ai-chat section-space">
              <div class="ai-chat-head">追问上下文 <span class="quiet" style="margin-left:8px">基于当前选择主播的话术证据</span></div>
              <div class="ai-chat-body" ref="aiChatEl">
                <div v-for="(m,i) in aiMessages" :key="i" class="chat-msg" :class="m.role"><div class="chat-bubble" :class="{thinking:m.thinking}"><template v-if="m.thinking"><span class="ai-thinking"><span>{{m.content}}</span><i></i><i></i><i></i></span></template><template v-else>{{m.content}}</template></div></div>
                <div v-if="!aiMessages.length" class="quiet">可以问：这场直播核心卖点是什么？观众最关心什么？哪些话术有风险？</div>
              </div>
              <div class="ai-chat-input"><el-input v-model="aiQuestion" type="textarea" :autosize="{minRows:1,maxRows:3}" placeholder="输入你的追问，回车发送" @keydown.enter.exact.prevent="askAi"/><el-button type="primary" :loading="aiAsking" @click="askAi">发送</el-button></div>
            </div>
          </div>
        </div>
      </template>

      <template v-else-if="view==='pre'">
        <div v-if="!perfDetail" class="perf-layout">
          <div class="perf-filters">
            <el-input v-model="perfFilters.keyword" placeholder="筛选主播" clearable><template #prefix><el-icon><Search/></el-icon></template></el-input>
            <el-select v-model="perfFilters.rating" clearable placeholder="评级"><el-option v-for="r in perfRatings" :key="r" :label="r" :value="r"/></el-select>

  function mdToHtml(md){
    const lines=String(md||'').replace(/\r/g,'').split('\n');let html='',inList=false;
    const close=()=>{if(inList){html+='</ul>';inList=false}};
    for(const raw of lines){
      const line=raw.trim();
      if(!line){close();continue}
      if(line.startsWith('### ')){close();html+='<h3>'+inlineMd(line.slice(4))+'</h3>';continue}
      if(line.startsWith('## ')){close();html+='<h2>'+inlineMd(line.slice(3))+'</h2>';continue}
      if(line.startsWith('# ')){close();html+='<h1>'+inlineMd(line.slice(2))+'</h1>';continue}
      if(line.startsWith('>')){close();html+='<blockquote>'+inlineMd(line.replace(/^>\s*/,''))+'</blockquote>';continue}
      if(/^[-*]\s+/.test(line)){if(!inList){html+='<ul>';inList=true}html+='<li>'+inlineMd(line.replace(/^[-*]\s+/,''))+'</li>';continue}
      close();html+='<p>'+inlineMd(line)+'</p>';
    }
    close();return html;
  }

      .replace(/^\s*[-*]\s+/gm,'')
      .replace(/\*\*(.*?)\*\*/g,'$1')
      .replace(/\[(.*?)\]\((.*?)\)/g,'$1')
      .replace(/\s+/g,' ')
      .trim();
  }

  async function testAiConfig(){aiTesting.value=true;try{await saveAiConfig();const resp=await fetch('/api/ai/test',{method:'POST'});const r=await resp.json();if(!resp.ok)throw new Error(r.detail||'测试失败');ElMessage.success('AI连通成功：'+(r.reply||'OK'))}catch(e){ElMessage.error('AI测试失败：'+e.message)}finally{aiTesting.value=false}}
  async function fetchVideoQuality(){try{const r=await(await fetch('/api/video-quality')).json();videoQuality.value=r.quality||'hd';videoQualityChoices.value=r.choices||[]}catch(e){}}

  async function refreshAnchor(row){if(refreshingAnchors.has(row.rid))return;refreshingAnchors.add(row.rid);try{const text='https://live.douyin.com/'+row.rid;const r=await(await fetch('/api/anchor/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input_text:text})})).json();if(!r.ok)throw new Error(r.error||'解析失败');await fetch('/api/anchors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r.anchor)});ElMessage.success(r.anchor.anchor_name?'主播资料已更新':'已更新直播状态，暂未取得昵称');refresh()}catch(e){ElMessage.error('刷新主播资料失败')}finally{refreshingAnchors.delete(row.rid)}}
  function saveWords(){localStorage.setItem('livewatch_words',JSON.stringify(words.value))}
  function addWord(){const text=wordInput.value.trim();if(!text)return;if(!words.value.some(w=>w.text===text&&w.type===wordType.value))words.value.push({text,type:wordType.value});wordInput.value='';saveWords()}
  function removeWord(i){words.value.splice(i,1);saveWords()}
  function refreshAll(){refresh();refreshData();fetchPerformance();refreshDiag();fetchExportDir();fetchProxy();fetchAiConfig();fetchVideoQuality();ElMessage.success('已刷新')}
  function _onTourKey(e){if(tour.active&&e.key==='Escape')endTour()}
  function _onTourResize(){if(tour.active)positionTour()}
  let timer,clockTimer;onMounted(()=>{
    try{const _pw=JSON.parse(localStorage.getItem('livewatch_words')||'[]');words.value=Array.isArray(_pw)?_pw:[]}catch(e){}
    refreshAll();timer=setInterval(refresh,3000);clockTimer=setInterval(()=>{clock.value=Math.floor(Date.now()/1000)},1000);
    window.addEventListener('keydown',_onTourKey);window.addEventListener('resize',_onTourResize);
    // 首次进入自动开始新手引导；之后不再自动弹（localStorage 标记）。失败绝不阻塞界面。
    if(!localStorage.getItem('livewatch_tour_done')){setTimeout(()=>{try{startTour()}catch(e){}},800)}

  onUnmounted(()=>{clearInterval(timer);clearInterval(clockTimer);window.removeEventListener('keydown',_onTourKey);window.removeEventListener('resize',_onTourResize)});
  watch(view,v=>{if(['review','cloud','settings'].includes(v))refreshData();if(v==='review')setTimeout(refreshWordCloud,120);if(v==='pre')fetchPerformance();if(['pre','settings'].includes(v))refreshDiag();if(['review','cloud','pre'].includes(v))relayoutTables()});

}});
window.__liveApp=app;
app.config.errorHandler=(err,_vm,info)=>{
  console.error('[VUE]',info,err);
  let dump='';
  try{
    if(window.__compiledCode){
      const cl=window.__compiledCode.split('\n');
      dump+='\n\n=== OUTER BODY ('+cl.length+' lines) — error at L245:52 ===\n';
      for(let i=241;i<=248&&i<cl.length;i++) dump+='L'+(i+1)+': '+cl[i].slice(0,500)+'\n';
    }else{
      dump+='\n[__compiledCode not captured — proxy may not have fired]\n';
    }
    const src=(window.__liveApp&&window.__liveApp._component&&window.__liveApp._component.render)?window.__liveApp._component.render.toString():'';
    if(src){
      const lines=src.split('\n');
      dump+='\n=== RENDER fn ('+lines.length+' lines) — first 6 lines ===\n';
      lines.slice(0,6).forEach((l,i)=>dump+='R'+(i+1)+': '+l.slice(0,300)+'\n');
      dump+='\n--- R60-R80 ---\n';
      lines.slice(59,80).forEach((l,i)=>dump+='R'+(i+60)+': '+l.slice(0,300)+'\n');
      dump+='\n--- R115-R135 ---\n';
      lines.slice(114,135).forEach((l,i)=>dump+='R'+(i+115)+': '+l.slice(0,300)+'\n');
    }
  }catch(de){dump+='\n[diag error] '+de}
  const pre=document.createElement('pre');
  pre.textContent=info+'\n\n'+err.stack+dump;
  pre.style.cssText='position:fixed;inset:0;padding:16px;background:#fff;color:#c00;font-size:10px;overflow:auto;z-index:9999;white-space:pre-wrap;word-break:break-all';
  document.body.appendChild(pre);
};
app.use(ElementPlus);for(const[k,c]of Object.entries(ElementPlusIconsVue))app.component(k,c);app.mount('#app');
